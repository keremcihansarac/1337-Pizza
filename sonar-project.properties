sonar.projectKey=1337_Pizza
sonar.qualitygate.wait=true

# Specify Python version to get better results
sonar.python.version=3

# Ignore some specific rules
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S8392
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S8415
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*

# Exclude XML files, infra and frontend from Sonar analysis
sonar.exclusions=**/*.xml, infra/**, pizza_1337_preact/**/*.*, **/migrations/**/*.*

# ----------------------------------------------------
# Specify the coverage file
sonar.python.coverage.reportPaths=integration_coverage.xml

# sonar.tests=tests
sonar.coverage.exclusions=**/exclude/**/*.*, **/exclude.py, **/main.py, **/migrations/**/*.*, **/tests/**/*.*, **/router.py, **/exceptions/**/*.*



